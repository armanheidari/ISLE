services:
  elasticsearch:
      image: elasticsearch:8.13.4
      container_name: es
      environment:
          - discovery.type=single-node
          - xpack.security.enabled=false
          - ES_JAVA_OPTS=-Xms4g -Xmx4g
      ports:
          - '9200:9200'
          - '9300:9300'
      volumes:
          - ./esdata:/usr/share/elasticsearch/data
          # - /tmp/data/es/esdata:/usr/share/elasticsearch/data
      deploy:
          resources:
              limits:
                  memory: 6g
              reservations:
                  memory: 4g
      ulimits:
          memlock:
              soft: -1
              hard: -1
      networks:
        - backend-network


  kibana:
    image: kibana:8.13.4
    container_name: kibana
    environment:
        - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
        - '5601:5601'
    depends_on:
        - elasticsearch
    networks:
      - backend-network


networks:
    backend-network:
        driver: bridge
        external: true
