<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="faviconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Document base -->
  <rect x="4" y="6" width="16" height="20" rx="2" fill="url(#faviconGradient)"/>
  
  <!-- Document lines -->
  <rect x="6" y="9" width="12" height="1" fill="white" opacity="0.8"/>
  <rect x="6" y="12" width="8" height="1" fill="white" opacity="0.6"/>
  <rect x="6" y="15" width="10" height="1" fill="white" opacity="0.7"/>
  <rect x="6" y="18" width="6" height="1" fill="white" opacity="0.5"/>
  <rect x="6" y="21" width="12" height="1" fill="white" opacity="0.6"/>
  
  <!-- Magnifying glass -->
  <circle cx="14" cy="14" r="4" fill="none" stroke="white" stroke-width="1.5" opacity="0.9"/>
  <line x1="16" y1="16" x2="20" y2="20" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.9"/>
  
  <!-- Scientific symbols -->
  <circle cx="8" cy="4" r="1" fill="white" opacity="0.7"/>
  <circle cx="12" cy="3" r="0.8" fill="white" opacity="0.5"/>
  <circle cx="16" cy="4" r="0.9" fill="white" opacity="0.6"/>
</svg>
