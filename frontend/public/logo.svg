<svg width="200" height="60" viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle with gradient -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E40AF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1F2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#374151;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Main icon - stylized document with magnifying glass -->
  <g transform="translate(10, 10)">
    <!-- Document base -->
    <rect x="0" y="8" width="24" height="32" rx="2" fill="url(#logoGradient)" opacity="0.9"/>
    
    <!-- Document lines -->
    <rect x="4" y="12" width="16" height="1.5" fill="white" opacity="0.8"/>
    <rect x="4" y="16" width="12" height="1.5" fill="white" opacity="0.6"/>
    <rect x="4" y="20" width="14" height="1.5" fill="white" opacity="0.7"/>
    <rect x="4" y="24" width="10" height="1.5" fill="white" opacity="0.5"/>
    <rect x="4" y="28" width="16" height="1.5" fill="white" opacity="0.6"/>
    <rect x="4" y="32" width="8" height="1.5" fill="white" opacity="0.4"/>
    
    <!-- Magnifying glass -->
    <circle cx="18" cy="18" r="6" fill="none" stroke="white" stroke-width="2" opacity="0.9"/>
    <line x1="22" y1="22" x2="26" y2="26" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
    
    <!-- Scientific symbols -->
    <circle cx="6" cy="6" r="1.5" fill="white" opacity="0.7"/>
    <circle cx="12" cy="4" r="1" fill="white" opacity="0.5"/>
    <circle cx="18" cy="6" r="1.2" fill="white" opacity="0.6"/>
  </g>
  
  <!-- Text -->
  <g transform="translate(50, 15)">
    <text x="0" y="28" font-family="Inter, -apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800" fill="#3B82F6">
      ISLE
    </text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="180" cy="15" r="2" fill="#3B82F6" opacity="0.3"/>
  <circle cx="185" cy="25" r="1.5" fill="#1E40AF" opacity="0.4"/>
  <circle cx="175" cy="35" r="1" fill="#3B82F6" opacity="0.2"/>
</svg>
